<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="apple-touch-icon" href="https://augustineiacopelli.github.io/appaday/icons/118.png">
<meta name="apple-mobile-web-app-title" content="Mercy">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Divine Mercy Chaplet Companion | AppADay 118</title>
<style>
  :root{
    --maroon:#6e1423;
    --maroon-dark:#4a0e18;
    --gold:#c9a24b;
    --cream:#faf3e6;
    --ink:#2b1a12;
    --line:#e3d5bd;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100dvh;
    background:linear-gradient(180deg,var(--cream) 0%,#f3e7d0 100%);
    color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.75rem;
    padding:0.85rem 1rem;
    background:var(--maroon-dark);
    color:var(--cream);
    flex-wrap:wrap;
  }
  header .app-tag{
    font-size:0.75rem;
    letter-spacing:0.08em;
    opacity:0.75;
    text-transform:uppercase;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  header .app-title{
    font-size:1rem;
    font-weight:600;
    margin-top:0.15rem;
  }
  header a{
    color:var(--gold);
    text-decoration:none;
    font-size:0.85rem;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:0.5rem 0.25rem;
    min-height:44px;
    display:inline-flex;
    align-items:center;
  }
  header a:hover{ text-decoration:underline; }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:1.5rem 1rem 2rem;
    width:100%;
  }

  .stage{
    width:100%;
    max-width:34rem;
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:1rem;
    box-shadow:0 12px 30px rgba(74,14,24,0.12);
    padding:2rem 1.5rem 1.75rem;
    text-align:center;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage:active{ transform:scale(0.995); }

  .label{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:0.72rem;
    color:var(--maroon);
    font-weight:600;
    margin-bottom:1rem;
  }

  .prayer-text{
    font-size:1.28rem;
    line-height:1.65;
    color:var(--ink);
    min-height:6rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .hint{
    margin-top:1.25rem;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.75rem;
    color:#9a8568;
  }

  .progress-wrap{
    width:100%;
    max-width:34rem;
    margin-top:1.25rem;
  }
  .progress-line{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.8rem;
    color:var(--maroon-dark);
    margin-bottom:0.4rem;
    text-align:center;
  }
  .progress-track{
    width:100%;
    height:8px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--maroon) 0%,var(--gold) 100%);
    border-radius:999px;
    transition:width 0.25s ease;
  }

  .controls{
    width:100%;
    max-width:34rem;
    margin-top:1.5rem;
    display:flex;
    flex-direction:column;
    gap:0.6rem;
    align-items:center;
  }
  button{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    border:none;
    border-radius:0.7rem;
    cursor:pointer;
    min-height:44px;
    -webkit-tap-highlight-color:transparent;
  }
  #nextBtn{
    width:100%;
    background:var(--maroon);
    color:var(--cream);
    font-size:1rem;
    font-weight:600;
    padding:0.9rem 1rem;
    letter-spacing:0.02em;
    box-shadow:0 6px 16px rgba(110,20,35,0.3);
  }
  #nextBtn:active{ background:var(--maroon-dark); }
  #resetBtn{
    background:transparent;
    color:#9a8568;
    font-size:0.8rem;
    padding:0.6rem 1rem;
    text-decoration:underline;
  }

  footer{
    text-align:center;
    padding:1rem;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.78rem;
  }
  footer a{
    color:var(--maroon);
    text-decoration:none;
    padding:0.5rem 0.25rem;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  footer a:hover{ text-decoration:underline; }

  @media (max-width:400px){
    .prayer-text{ font-size:1.12rem; }
    .stage{ padding:1.5rem 1.1rem 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="app-tag">AppADay &middot; 118</div>
    <div class="app-title">Divine Mercy Chaplet Companion</div>
  </div>
  <a href="https://augustineiacopelli.github.io/appaday/">&larr; Portfolio</a>
</header>

<main>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Tap to advance the chaplet">
    <div class="label" id="stepLabel">Opening</div>
    <div class="prayer-text" id="prayerText">Loading&hellip;</div>
    <div class="hint">Tap anywhere to pray the next line</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-line" id="progressLine">Step 1 of 1</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="controls">
    <button id="nextBtn" type="button">Next</button>
    <button id="resetBtn" type="button">Reset Chaplet</button>
  </div>
</main>

<footer>
  <a href="https://augustineiacopelli.github.io/appaday/">AppADay &middot; Portfolio Home</a>
</footer>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "appaday-118-chaplet-index";

  var OUR_FATHER = "Our Father, who art in heaven, hallowed be Thy name. Thy kingdom come, Thy will be done, on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us. And lead us not into temptation, but deliver us from evil. Amen.";
  var HAIL_MARY = "Hail Mary, full of grace, the Lord is with thee. Blessed art thou amongst women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.";
  var APOSTLES_CREED = "I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.";
  var OFFERING_PRAYER = "Eternal Father, I offer You the Body and Blood, Soul and Divinity of Your dearly beloved Son, Our Lord Jesus Christ, in atonement for our sins and those of the whole world.";
  var PETITION_PRAYER = "For the sake of His sorrowful Passion, have mercy on us and on the whole world.";
  var HOLY_GOD = "Holy God, Holy Mighty One, Holy Immortal One, have mercy on us and on the whole world.";
  var CLOSING_PRAYER = "Eternal God, in whom mercy is endless and the treasury of compassion inexhaustible, look kindly upon us and increase Your mercy in us, that in difficult moments we might not despair nor become despondent, but with great confidence submit ourselves to Your holy will, which is Love and Mercy itself.";
  var SIGN_OF_CROSS = "In the name of the Father, and of the Son, and of the Holy Spirit. Amen.";

  function buildSequence(){
    var seq = [];

    seq.push({ label: "Sign of the Cross", text: SIGN_OF_CROSS });
    seq.push({ label: "Opening", text: OUR_FATHER });
    seq.push({ label: "Opening", text: HAIL_MARY });
    seq.push({ label: "Opening", text: APOSTLES_CREED });

    var decadeNames = ["First", "Second", "Third", "Fourth", "Fifth"];
    for (var d = 0; d < 5; d++){
      seq.push({
        label: decadeNames[d] + " Decade \u2014 Offering",
        text: OFFERING_PRAYER
      });
      for (var p = 1; p <= 10; p++){
        seq.push({
          label: decadeNames[d] + " Decade \u2014 Petition " + p + " of 10",
          text: PETITION_PRAYER
        });
      }
    }

    seq.push({ label: "Closing \u2014 Holy God (1 of 3)", text: HOLY_GOD });
    seq.push({ label: "Closing \u2014 Holy God (2 of 3)", text: HOLY_GOD });
    seq.push({ label: "Closing \u2014 Holy God (3 of 3)", text: HOLY_GOD });
    seq.push({ label: "Closing Prayer", text: CLOSING_PRAYER });
    seq.push({ label: "Sign of the Cross", text: SIGN_OF_CROSS });

    return seq;
  }

  var CHAPLET_SEQUENCE = buildSequence();

  var index = 0;
  try {
    var saved = window.localStorage.getItem(STORAGE_KEY);
    if (saved !== null){
      var parsed = parseInt(saved, 10);
      if (!isNaN(parsed) && parsed >= 0 && parsed < CHAPLET_SEQUENCE.length){
        index = parsed;
      }
    }
  } catch (e) {
    index = 0;
  }

  var stepLabelEl = document.getElementById("stepLabel");
  var prayerTextEl = document.getElementById("prayerText");
  var progressLineEl = document.getElementById("progressLine");
  var progressFillEl = document.getElementById("progressFill");
  var nextBtn = document.getElementById("nextBtn");
  var resetBtn = document.getElementById("resetBtn");
  var stage = document.getElementById("stage");

  function saveIndex(){
    try {
      window.localStorage.setItem(STORAGE_KEY, String(index));
    } catch (e) {
      /* storage unavailable, continue without persistence */
    }
  }

  function advance(){
    if (index < CHAPLET_SEQUENCE.length - 1){
      index = index + 1;
    } else {
      index = CHAPLET_SEQUENCE.length - 1;
    }
    saveIndex();
    render();
  }

  function reset(){
    index = 0;
    saveIndex();
    render();
  }

  function render(){
    var step = CHAPLET_SEQUENCE[index];
    var total = CHAPLET_SEQUENCE.length;

    stepLabelEl.textContent = step.label;
    prayerTextEl.textContent = step.text;
    progressLineEl.textContent = "Step " + (index + 1) + " of " + total;
    progressFillEl.style.width = (((index + 1) / total) * 100) + "%";

    if (index >= total - 1){
      nextBtn.textContent = "Begin Again";
    } else {
      nextBtn.textContent = "Next";
    }
  }

  nextBtn.addEventListener("click", function(evt){
    evt.stopPropagation();
    if (index >= CHAPLET_SEQUENCE.length - 1){
      reset();
    } else {
      advance();
    }
  });

  resetBtn.addEventListener("click", function(evt){
    evt.stopPropagation();
    reset();
  });

  stage.addEventListener("click", function(){
    if (index >= CHAPLET_SEQUENCE.length - 1){
      reset();
    } else {
      advance();
    }
  });

  stage.addEventListener("keydown", function(evt){
    if (evt.key === "Enter" || evt.key === " "){
      evt.preventDefault();
      if (index >= CHAPLET_SEQUENCE.length - 1){
        reset();
      } else {
        advance();
      }
    }
  });

  render();
})();
</script>

</body>
</html>
